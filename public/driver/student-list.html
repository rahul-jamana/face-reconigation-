<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bus Student Roster — Driver Portal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body { background-color: #f0f4f9; font-family: 'Segoe UI', system-ui, sans-serif; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid px-3">
      <a class="navbar-brand fw-bold" href="/driver/dashboard.html"><i class="fa-solid fa-arrow-left me-2"></i>Driver Console</a>
      <span class="navbar-text text-white">Route Student Roster</span>
    </div>
  </nav>

  <div class="container py-4">
    <div class="card border-0 shadow-sm rounded-4 p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold text-primary mb-0"><i class="fa-solid fa-users-rectangle me-2"></i>Registered Route Students (Feature 9)</h5>
        <button class="btn btn-sm btn-primary rounded-pill" onclick="loadList()"><i class="fa-solid fa-sync me-1"></i>Refresh</button>
      </div>

      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th>Student Name</th>
              <th>Roll Number</th>
              <th>Branch</th>
              <th>Stop</th>
              <th>Fee Status</th>
            </tr>
          </thead>
          <tbody id="student-list-body">
            <tr><td colspan="5" class="text-center text-muted py-4"><i class="fa-solid fa-spinner fa-spin me-2"></i>Loading student list...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    async function loadList() {
      try {
        const res = await fetch('/api/bus/students/1');
        const data = await res.json();
        const tbody = document.getElementById('student-list-body');
        if (data.success && data.students.length > 0) {
          tbody.innerHTML = data.students.map(s => `
            <tr>
              <td class="fw-bold text-dark">${s.name}</td>
              <td><span class="badge bg-secondary-subtle text-dark">${s.roll_number}</span></td>
              <td>${s.branch}</td>
              <td>${s.stop_name || 'Pitapalli Square'}</td>
              <td><span class="badge ${s.fee_status === 'PAID' ? 'bg-success' : 'bg-danger'}">${s.fee_status || 'PAID'}</span></td>
            </tr>
          `).join('');
        }
      } catch (e) {}
    }
    loadList();
  </script>
</body>
</html>
