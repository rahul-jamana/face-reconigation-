<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transport Fees Management — Admin Console</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body { background-color: #f0f4f9; font-family: 'Segoe UI', system-ui, sans-serif; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold" href="/admin/buses.html"><i class="fa-solid fa-arrow-left me-2"></i>Admin Console</a>
      <span class="navbar-text text-white">Transport Fee Audit & Blocking</span>
    </div>
  </nav>

  <div class="container-fluid px-4 py-4">
    <div class="card border-0 shadow-sm rounded-4 p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h5 class="fw-bold text-primary mb-1"><i class="fa-solid fa-indian-rupee-sign me-2"></i>Transport Fee Ledger (Feature 7)</h5>
          <span class="text-muted small">Only students with <strong>PAID</strong> fee status are permitted to board transport buses.</span>
        </div>
        <button class="btn btn-sm btn-primary rounded-pill" onclick="loadFees()"><i class="fa-solid fa-sync me-1"></i>Refresh Fee Audit</button>
      </div>

      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th>Student Name</th>
              <th>Roll Number</th>
              <th>Academic Year</th>
              <th>Total Fee</th>
              <th>Paid Amount</th>
              <th>Pending Amount</th>
              <th>Fee Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="fees-table">
            <tr><td colspan="8" class="text-center text-muted py-4"><i class="fa-solid fa-spinner fa-spin me-2"></i>Loading transport fee records...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    async function loadFees() {
      try {
        const res = await fetch('/api/transport-fees');
        const data = await res.json();
        const tbody = document.getElementById('fees-table');
        if (data.success && data.fees.length > 0) {
          tbody.innerHTML = data.fees.map(f => `
            <tr>
              <td class="fw-bold text-dark">${f.student_name}</td>
              <td><span class="badge bg-secondary-subtle text-dark">${f.roll_number}</span></td>
              <td>${f.academic_year || '2026'}</td>
              <td>₹${f.total_fee}</td>
              <td><span class="text-success font-monospace fw-bold">₹${f.paid_amount}</span></td>
              <td><span class="${f.pending_amount > 0 ? 'text-danger fw-bold' : 'text-muted'} font-monospace">₹${f.pending_amount}</span></td>
              <td>
                <span class="badge ${f.status === 'PAID' ? 'bg-success' : 'bg-danger'} py-2 px-3">
                  ${f.status === 'PAID' ? '<i class="fa-solid fa-check-circle me-1"></i>PAID' : '<i class="fa-solid fa-ban me-1"></i>UNPAID (BLOCKED)'}
                </span>
              </td>
              <td>
                <button class="btn btn-sm ${f.status === 'PAID' ? 'btn-outline-danger' : 'btn-outline-success'} rounded-pill" onclick="toggleFeeStatus(${f.student_id}, '${f.status}')">
                  ${f.status === 'PAID' ? 'Mark Unpaid' : 'Mark Paid & Unblock'}
                </button>
              </td>
            </tr>
          `).join('');
        }
      } catch (e) {}
    }

    async function toggleFeeStatus(studentId, currentStatus) {
      const newStatus = currentStatus === 'PAID' ? 'UNPAID' : 'PAID';
      const paidAmt = newStatus === 'PAID' ? 15000 : 0;
      const pendingAmt = newStatus === 'PAID' ? 0 : 15000;

      await fetch(`/api/transport-fees/${studentId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus, paid_amount: paidAmt, pending_amount: pendingAmt })
      });
      loadFees();
    }

    loadFees();
  </script>
</body>
</html>
